[package]
name = "verifier"
version = "0.2.0"
edition = "2021"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.4", features = ["v4"] }
log = "0.4"
env_logger = "0.10"

# Real verification dependencies
z3 = "0.12"
wasmtime = "18.0"
tree-sitter = "0.20"
tree-sitter-python = "0.20"

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3.0"
